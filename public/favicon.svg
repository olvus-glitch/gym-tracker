<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b21b6"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8e4f0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Dumbbell icon -->
  <g transform="translate(256,256)" fill="none" stroke="url(#fg)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bar -->
    <line x1="-90" y1="0" x2="90" y2="0"/>
    <!-- Left weight -->
    <rect x="-130" y="-55" width="40" height="110" rx="8" fill="url(#fg)" stroke="none"/>
    <rect x="-155" y="-40" width="25" height="80" rx="6" fill="url(#fg)" stroke="none" opacity="0.7"/>
    <!-- Right weight -->
    <rect x="90" y="-55" width="40" height="110" rx="8" fill="url(#fg)" stroke="none"/>
    <rect x="130" y="-40" width="25" height="80" rx="6" fill="url(#fg)" stroke="none" opacity="0.7"/>
  </g>
  <!-- FORJA text -->
  <text x="256" y="410" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif" font-weight="900" font-size="72" letter-spacing="12" opacity="0.95">FORJA</text>
</svg>
